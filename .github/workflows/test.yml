name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Unit and browser integration tests
        env:
          DGODRIVER_BROWSER: /usr/bin/google-chrome
          CGO_ENABLED: '1'
        run: go test -race ./... -timeout 120s
      - run: go vet ./...
      - name: Reproducible CDP generation
        run: |
          go generate ./cdp
          git diff --exit-code -- cdp
